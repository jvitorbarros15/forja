<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Forja</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='2' y='2' width='60' height='60' rx='14' fill='%2318181b'/%3E%3Cpath d='M32 9c1 8 3 11 8 12-5 1-7 4-8 10-1-6-3-9-8-10 5-1 7-4 8-12z' fill='%23f97316'/%3E%3Cpath d='M14 36h30c6 0 11 1 14 2-6 3-12 5-18 7 1 3 3 6 7 8H18c4-2 6-5 7-8l-8-3c-2-1-3-3-3-6z' fill='%23fafafa'/%3E%3C/svg%3E">
<style>
/* 1. Tokens. Every color has a light and a dark value; components read tones through data-tone. */
:root{
  --bg:#f5f6f8;--surface:#ffffff;--raised:#fbfbfc;--ink:#10141b;--muted:#5a6370;--line:#dde2e9;--line-strong:#c4cbd5;
  --accent:#1f4fff;--accent-soft:#e7ecff;--on-accent:#ffffff;
  --warn:#93370d;--warn-soft:#fff0dc;--warn-line:#e8b583;--ok:#05603a;--ok-soft:#e3f5ec;--bad:#b42318;--bad-soft:#fdeceb;
  --forge:#e8590c;--forge-ink:#b83a05;--forge-grad:linear-gradient(90deg,#fbbf24,#f97316 55%,#dc4a0f);
  --track:#3b4350;--track-off:#dde2e9;
  --approve:#0a6b3c;--approve-soft:#dff5e9;--approve-fill:#0b7a43;--approve-on:#ffffff;
  --deploy:#1f4fff;--deploy-soft:#e7ecff;--deploy-fill:#1f4fff;--deploy-on:#ffffff;
  --deploy-test:#6d28d9;--deploy-test-soft:#efe7ff;--deploy-test-fill:#6d28d9;--deploy-test-on:#ffffff;
  --pause:#7a5200;--pause-soft:#fff3c4;--pause-fill:#f2b705;--pause-on:#2b1f00;
  --redo:#b03d08;--redo-soft:#ffe6d6;--redo-fill:#c2410c;--redo-on:#ffffff;
  --shadow:0 10px 30px rgba(16,20,27,.12);--shade:rgba(10,12,16,.45);
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;--mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1016;--surface:#151a22;--raised:#1a2029;--ink:#e9edf3;--muted:#a1aab7;--line:#28303b;--line-strong:#3a4452;
  --accent:#8aa3ff;--accent-soft:#1b2447;--on-accent:#0d1016;
  --warn:#f7a84e;--warn-soft:#2e2010;--warn-line:#6b4a1f;--ok:#58d69a;--ok-soft:#0f2a1d;--bad:#ff8577;--bad-soft:#3b1613;
  --forge:#fb923c;--forge-ink:#fdba74;--track:#c3cad4;--track-off:#2c3541;
  --approve:#5fd69a;--approve-soft:#10301f;--approve-fill:#35c07d;--approve-on:#04210f;
  --deploy:#8aa3ff;--deploy-soft:#1b2447;--deploy-fill:#7f9bff;--deploy-on:#0a1030;
  --deploy-test:#c4a7ff;--deploy-test-soft:#2a1d4d;--deploy-test-fill:#b794ff;--deploy-test-on:#1a0b3d;
  --pause:#f5c451;--pause-soft:#3a2c0a;--pause-fill:#f5c451;--pause-on:#2b1f00;
  --redo:#ff9d66;--redo-soft:#3d1f0d;--redo-fill:#ff8f52;--redo-on:#2e1200;
  --shadow:0 10px 30px rgba(0,0,0,.5);--shade:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1016;--surface:#151a22;--raised:#1a2029;--ink:#e9edf3;--muted:#a1aab7;--line:#28303b;--line-strong:#3a4452;
  --accent:#8aa3ff;--accent-soft:#1b2447;--on-accent:#0d1016;
  --warn:#f7a84e;--warn-soft:#2e2010;--warn-line:#6b4a1f;--ok:#58d69a;--ok-soft:#0f2a1d;--bad:#ff8577;--bad-soft:#3b1613;
  --forge:#fb923c;--forge-ink:#fdba74;--track:#c3cad4;--track-off:#2c3541;
  --approve:#5fd69a;--approve-soft:#10301f;--approve-fill:#35c07d;--approve-on:#04210f;
  --deploy:#8aa3ff;--deploy-soft:#1b2447;--deploy-fill:#7f9bff;--deploy-on:#0a1030;
  --deploy-test:#c4a7ff;--deploy-test-soft:#2a1d4d;--deploy-test-fill:#b794ff;--deploy-test-on:#1a0b3d;
  --pause:#f5c451;--pause-soft:#3a2c0a;--pause-fill:#f5c451;--pause-on:#2b1f00;
  --redo:#ff9d66;--redo-soft:#3d1f0d;--redo-fill:#ff8f52;--redo-on:#2e1200;
  --shadow:0 10px 30px rgba(0,0,0,.5);--shade:rgba(0,0,0,.6);color-scheme:dark}
[data-tone="approve"]{--tone:var(--approve);--tone-soft:var(--approve-soft);--tone-fill:var(--approve-fill);--tone-on:var(--approve-on)}
[data-tone="deploy"]{--tone:var(--deploy);--tone-soft:var(--deploy-soft);--tone-fill:var(--deploy-fill);--tone-on:var(--deploy-on)}
[data-tone="deploy-test"]{--tone:var(--deploy-test);--tone-soft:var(--deploy-test-soft);--tone-fill:var(--deploy-test-fill);--tone-on:var(--deploy-test-on)}
[data-tone="pause"]{--tone:var(--pause);--tone-soft:var(--pause-soft);--tone-fill:var(--pause-fill);--tone-on:var(--pause-on)}
[data-tone="redo"]{--tone:var(--redo);--tone-soft:var(--redo-soft);--tone-fill:var(--redo-fill);--tone-on:var(--redo-on)}
[data-tone="ok"]{--tone:var(--ok);--tone-soft:var(--ok-soft);--tone-fill:var(--approve-fill);--tone-on:var(--approve-on)}
[data-tone="bad"]{--tone:var(--bad);--tone-soft:var(--bad-soft);--tone-fill:var(--bad);--tone-on:var(--surface)}
[data-tone="warn"]{--tone:var(--warn);--tone-soft:var(--warn-soft);--tone-fill:var(--warn);--tone-on:var(--surface)}

/* 2. Base */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;padding-bottom:48px}
button,textarea,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
[hidden]{display:none!important}
h1,h2,h3,h4,p{margin:0}
kbd{font:500 11px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--raised);color:var(--muted)}
.mono{font-family:var(--mono)}
.tk{font-variant-numeric:tabular-nums}
.tm{font:11px var(--mono);color:var(--muted);white-space:nowrap}
.ico{display:inline-flex;width:16px;height:16px;flex:none}.ico svg{width:100%;height:100%;display:block}
#page{max-width:1320px;margin-inline:auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.rule{height:3px;background:var(--forge-grad)}

/* 3. Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;padding-block:14px 10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand svg{width:36px;height:36px;flex:none;display:block}
.brand h1{font-size:20px;line-height:1.1;font-weight:750;letter-spacing:-.025em}
.brand .repo{display:block;font:12px var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw;text-decoration:none;margin-top:2px}
.brand .repo:hover{color:var(--ink);text-decoration:underline}
.tools{display:flex;align-items:center;gap:8px}
.ibtn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;min-height:36px;padding:0 12px;font-size:13px;font-weight:550;transition:border-color .15s,background-color .15s,transform .1s}
.ibtn:hover{border-color:var(--line-strong);background:var(--raised)}
.ibtn:active{transform:scale(.97)}
.ibtn.sq{width:36px;padding:0}
.ibtn.go{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ibtn.go:hover{background:var(--ink);opacity:.9}
.stat-line{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;padding-bottom:12px;font:12px var(--mono);color:var(--muted)}
.stat-line .live{display:inline-flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.live.on .dot{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.runner.bad{color:var(--bad);font-weight:600}
.banner{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--warn-line);background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.banner .ico{margin-top:1px}.banner p{overflow-wrap:anywhere}.banner b{font-variant-numeric:tabular-nums}
.help{position:fixed;z-index:45;right:16px;top:64px;width:min(360px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;font-size:13px}
.help h2{font-size:13px;margin-bottom:8px}
.help dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:baseline}.help dd{margin:0;color:var(--muted)}

/* 4. Tabs and filters */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{position:relative;flex:0 0 auto;border:0;background:none;padding:11px 14px;font-size:13.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-pressed="true"]{color:var(--ink)}
.tabs button[aria-pressed="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--forge-grad)}
.tabs button:focus-visible{outline-offset:-3px;border-radius:8px}
.count{font:600 11px var(--mono);min-width:20px;text-align:center;border-radius:999px;padding:1px 6px;background:var(--raised);border:1px solid var(--line);color:var(--muted)}
.count.hot{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-bottom:14px}
.search{position:relative;flex:1 1 220px;max-width:360px;min-width:0}
.search input{width:100%;height:38px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:0 34px 0 11px}
.search kbd{position:absolute;right:9px;top:9px;pointer-events:none}
.bar select{height:38px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:0 8px;font-size:13px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;min-height:36px;padding:0 12px;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.seg button:focus-visible{outline-offset:-2px}
.grow{flex:1}
.fstat{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--muted);margin:-4px 0 12px}
.link{border:0;background:none;color:var(--accent);text-decoration:underline;font:inherit;padding:2px}

/* 5. Sections */
.sec{margin-bottom:26px}
.sec>header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sec>header h2{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.sec>header::after{content:"";flex:1;height:1px;background:var(--line)}
.sec.need>header h2{color:var(--warn)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,350px),1fr));gap:12px;align-items:start}
.grid.two{grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr))}
.empty{border:1px dashed var(--line-strong);border-radius:12px;padding:16px 14px;color:var(--muted);text-align:center;font-size:13px}
.empty.calm{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--ok);background:var(--ok-soft);border:1px solid transparent}

/* 6. Job card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-width:0;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
.card.stopped{border-color:var(--warn-line)}
.card.running{border-color:color-mix(in srgb,var(--forge) 45%,var(--line))}
.cbody{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:9px;padding:13px 14px;cursor:pointer;min-width:0}
.cbody:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:12px}
.meta{display:flex;align-items:center;justify-content:space-between;gap:8px;font:12px var(--mono);color:var(--muted)}
.meta .l{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.meta b{color:var(--ink);font-weight:650}
.title{font-weight:620;font-size:15px;line-height:1.3;overflow-wrap:anywhere;text-wrap:pretty}
.tier{font:650 11px var(--mono);padding:1px 7px;border-radius:5px;white-space:nowrap;background:var(--accent-soft);color:var(--accent)}
.tier[data-r="low"]{background:var(--ok-soft);color:var(--ok)}
.tier[data-r="high"]{background:var(--bad-soft);color:var(--bad)}
.tier.try{background:transparent;box-shadow:inset 0 0 0 1px currentColor}
.track{display:flex;flex-direction:column;gap:6px}
.segs{display:flex;gap:3px}
.segs i{flex:1;height:5px;border-radius:3px;background:var(--track-off)}
.segs i.done{background:var(--track)}
.segs i.now{background:var(--forge-grad)}
.segs.live i.now{animation:ember 2.2s ease-in-out infinite}
.segs.stop i.now{background:var(--warn)}
.trow{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.trow b{color:var(--ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font:11px var(--mono);padding:1px 7px;border-radius:999px;background:var(--raised);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.PASS,.chip.pass{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.CHANGES,.chip.fail{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.OVR,.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.queue{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.state{font-size:13px;color:var(--muted);overflow-wrap:anywhere;display:flex;gap:8px;align-items:baseline}
.state::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:currentColor;transform:translateY(-1px)}
.state.run{color:var(--ink)}.state.run::before{background:var(--forge);animation:pulse 1.6s ease-in-out infinite}
.state.need{color:var(--warn);font-weight:550}.state.done{color:var(--ok)}.state.pause{color:var(--pause);font-weight:550}
.state.quota{color:var(--warn);font-weight:550}.state.quota::before{border-radius:2px;transform:translateY(-1px) rotate(45deg)}
.foot{display:flex;justify-content:space-between;gap:8px;font:11px var(--mono);color:var(--muted);flex-wrap:wrap}
.queued{font:500 11px var(--mono);padding:3px 8px;border-radius:6px;color:var(--tone);align-self:flex-start;border:1px solid var(--tone)}
.shim{background-color:var(--tone-soft);background-image:linear-gradient(100deg,transparent 25%,color-mix(in srgb,var(--tone) 22%,transparent) 50%,transparent 75%);background-size:220% 100%;background-repeat:no-repeat;animation:shim 1.9s linear infinite}
.flash{animation:flash 1.3s ease-out both}
.pop{animation:pop .3s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes shim{from{background-position:130% 0}to{background-position:-130% 0}}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--flash)}25%{box-shadow:0 0 0 5px var(--flash-soft);border-color:var(--flash)}100%{box-shadow:0 0 0 0 transparent}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes ember{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25)}}
@keyframes spin{to{transform:rotate(1turn)}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.grid>.card.rise{animation:rise .32s ease-out both}

/* 7. Decision box: the stopped job's reason, the recommendation, the buttons, the evidence */
.dbox{border-top:1px solid var(--warn-line);background:var(--warn-soft);border-radius:0 0 11px 11px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.drawer .dbox{border:1px solid var(--warn-line);border-radius:12px}
.dbox .why{font-weight:550;color:var(--ink);overflow-wrap:anywhere}
.dbox .todo{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.card .dbox .todo{display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.airec{padding:9px 11px;border-radius:9px;background:var(--surface);border:1px solid var(--tone);font-size:13px;overflow-wrap:anywhere}
.airec b{font-weight:650}.airec .act{color:var(--tone);font-weight:700}
.airec p+p{margin-top:3px}
.aibtn{margin-top:8px;display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--tone);background:var(--surface);color:var(--tone);font-weight:600;white-space:nowrap}
.aibtn:hover{background:var(--tone-soft)}
.aibtn:focus-visible{outline:2px solid var(--tone);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{position:relative;border:1px solid var(--tone,var(--line-strong));color:var(--tone,var(--ink));background:var(--surface);border-radius:9px;padding:0 16px;min-height:40px;font-weight:650;font-size:13.5px;transition:transform .12s ease,background-color .15s,box-shadow .15s}
.btn:hover:not(:disabled){background:var(--tone-soft,var(--raised))}
.btn.primary{background:var(--tone-fill);border-color:var(--tone-fill);color:var(--tone-on)}
.btn.primary:hover:not(:disabled){background:var(--tone-fill);box-shadow:0 0 0 3px var(--tone-soft)}
.btn.big{min-height:46px;padding:0 22px;font-size:15px}
.btn:active:not(:disabled){transform:scale(.96)}
.btn:disabled{opacity:.5;cursor:not-allowed;border-color:var(--line);color:var(--muted);background:var(--surface)}
.btn.sending{padding-right:36px}
.btn.sending::after{content:"";position:absolute;right:13px;top:50%;width:12px;height:12px;margin-top:-7px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.btn:focus-visible{outline:2px solid var(--tone,var(--accent));outline-offset:2px}
.ev{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:12px;color:var(--muted)}
.ev .chip{background:var(--surface)}
.ev .chip.PASS,.ev .chip.pass{background:var(--ok-soft)}.ev .chip.CHANGES,.ev .chip.fail{background:var(--bad-soft)}.ev .chip.OVR{background:var(--surface)}
.redo{display:flex;flex-direction:column;gap:8px}
label.lab{font-size:12px;font-weight:650;color:var(--muted)}
textarea{width:100%;min-height:76px;border:1px solid var(--line-strong);border-radius:9px;padding:9px 11px;background:var(--surface);resize:vertical}
textarea.miss,input.miss{border-color:var(--redo);box-shadow:0 0 0 3px var(--redo-soft)}
.hint{font-size:12px;color:var(--muted)}
.cmd{font-size:12px;display:flex;justify-content:space-between;gap:8px;padding:6px 9px;border-radius:7px;border:1px solid var(--tone);background:var(--tone-soft);overflow-wrap:anywhere}
.cmd b{color:var(--tone);font-weight:650}.cmd b::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--tone-fill);margin-right:6px;vertical-align:1px}
.cmd .res{white-space:nowrap;font:11px var(--mono)}
.cmd .res.bad{color:var(--bad);font-weight:600}.cmd .res.ok{color:var(--ok);font-weight:600}

/* 8. Deploy strip and done list */
.deploy{border:1px solid var(--tone,var(--line));background:var(--surface);border-radius:12px;padding:13px 15px;margin-bottom:26px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.deploy.ready{background:var(--tone-soft)}
.deploy .txt{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:3px}
.deploy h2{font-size:15px;font-weight:700;color:var(--tone,var(--ink));overflow-wrap:anywhere}
.deploy p{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.ids{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.idchip{border:1px solid var(--line);background:var(--raised);border-radius:999px;padding:1px 9px;font:500 12px var(--mono)}
.idchip:hover{border-color:var(--accent)}
.prog{display:flex;flex-direction:column;gap:6px;margin:3px 0;max-width:560px}
.ptime{font-size:14px;color:var(--ink)}.ptime .tk{font-weight:700;font-size:18px;color:var(--tone)}
.pover{display:none;color:var(--warn);font-weight:600}.deploy.over .pover{display:inline}
.pbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;width:var(--p,0%);background:var(--tone);border-radius:3px;transition:width 1s linear}
.dlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.drow{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:baseline;padding:10px 14px;cursor:pointer;border-top:1px solid var(--line)}
.drow:first-child{border-top:0}
.drow:hover{background:var(--raised)}
.drow:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.drow .id{font:600 12px var(--mono)}
.drow .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .s{font-size:12px;color:var(--ok);white-space:nowrap}
.drow .s.wait{color:var(--deploy)}
.more{margin-top:10px}

/* 9. Drawer */
.scrim{position:fixed;inset:0;background:var(--shade);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(102%);transition:transform .22s ease;z-index:21;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none}
.dhead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:16px 20px 14px;border-bottom:1px solid var(--line)}
.dhead h2{margin:6px 0 0;font-size:18px;line-height:1.3;text-wrap:balance;overflow-wrap:anywhere}
.dtools{display:flex;gap:6px;align-items:center;flex:none}
.dtools .pos{font:11px var(--mono);color:var(--muted);min-width:44px;text-align:center}
.x{border:1px solid var(--line);background:var(--raised);border-radius:8px;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;flex:none;padding:0}
.x:hover{border-color:var(--accent)}
.x:disabled{opacity:.4;cursor:not-allowed}
.dbody{overflow:auto;padding:16px 20px 32px;display:flex;flex-direction:column;gap:22px}
.dbody h3{margin:0 0 9px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.dstate{font-size:14px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{font-size:13px;text-decoration:none;color:var(--accent);border:1px solid var(--line);border-radius:8px;padding:6px 11px;background:var(--raised);min-height:34px;display:inline-flex;align-items:center}
.links a:hover{border-color:var(--accent)}
.stepper{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:0;padding:0;list-style:none}
.stepper li{font-size:11px;text-align:center;color:var(--muted);padding-top:8px;border-top:4px solid var(--track-off);border-radius:2px}
.stepper .done{border-color:var(--track);color:var(--ink)}
.stepper .now{border-image:var(--forge-grad) 1;border-image-slice:1;color:var(--ink);font-weight:650}
.stepper .stop{border-color:var(--warn);color:var(--warn);font-weight:650}
.summary{color:var(--ink);overflow-wrap:anywhere}
.actions{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--raised)}
.stack{display:flex;flex-direction:column;gap:8px}
.review{border:1px solid var(--line);border-radius:9px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.review .row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:600}
.review p{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
details.round{border:1px solid var(--line);border-radius:10px;background:var(--raised)}
details.round>summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 12px;font-size:13px;font-weight:600;min-height:40px}
details.round>summary::-webkit-details-marker{display:none}
details.round>summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);flex:none;transition:transform .15s;margin-right:-2px}
details.round[open]>summary::before{transform:rotate(45deg)}
details.round>summary .sm{margin-left:auto;font:400 11px var(--mono);color:var(--muted);text-align:right}
details.round>summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:10px}
.wk{display:flex;flex-direction:column;gap:6px;padding:0 10px 10px}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:13px}
.wrow .what{color:var(--muted);font-size:12px}
.wrow .num{font:12px var(--mono);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.st{font:11px var(--mono);padding:1px 7px;border-radius:999px;background:var(--raised);color:var(--muted);border:1px solid var(--line);justify-self:end}
.st.running{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.st.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.st.failed{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.wtot{font-size:12px;color:var(--muted);margin-top:9px}.wtot b{color:var(--ink);font-variant-numeric:tabular-nums}
.files{width:100%;border-collapse:collapse;font:12px var(--mono)}
.files td{padding:5px 0;border-bottom:1px solid var(--line)}
.files td.n{text-align:right;width:52px;font-variant-numeric:tabular-nums}
.add{color:var(--ok)}.del{color:var(--bad)}
.files a{color:var(--ink);text-decoration:none;overflow-wrap:anywhere}.files a:hover{color:var(--accent)}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.timeline li{display:grid;grid-template-columns:62px 1fr;gap:10px;font-size:13px;overflow-wrap:anywhere}
.timeline time{font:11px var(--mono);color:var(--muted);padding-top:2px}
.timeline .gap{font:10.5px var(--mono);color:var(--muted);margin-left:6px}
.dtime{font-size:12px;color:var(--muted)}

/* 10. Queue, issues, capacity */
.fhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;margin-bottom:12px}
.fhead h2{font-size:16px;font-weight:700}.fhead h2:focus{outline:none}
.fcap{margin-top:2px;font-size:13px;color:var(--muted)}.fcap b{color:var(--ink);font-variant-numeric:tabular-nums}
.fadd{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0}
.fadd input{width:130px;height:40px;border:1px solid var(--line);border-radius:9px;padding:0 11px;background:var(--surface)}
.merr{padding:8px 11px;border-radius:8px;background:var(--bad-soft);color:var(--bad);font-size:13px;overflow-wrap:anywhere;margin-bottom:10px}
.qlist,.ilist,.mqlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.qrow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:6px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.qrow.gone{background:var(--raised);border-style:dashed}
.qpos{font:600 12px var(--mono);color:var(--muted);text-align:center}
.qmain{min-width:0;display:flex;flex-direction:column;gap:5px}
.qtop{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
.qtop a{font:600 12px var(--mono);color:var(--accent);text-decoration:none}.qtop a:hover{text-decoration:underline}
.qtitle{font-weight:600;overflow-wrap:anywhere}
.qmeta{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.qbtns{display:flex;gap:6px}
.qbtns .x.rm,.ibtns .x{width:auto;padding:0 11px;font-size:12px;font-weight:600}
.iwrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.irow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.irow[draggable="true"]{cursor:grab}
.irow.dragging{opacity:.5}
.irow.locked{background:var(--raised)}
.isnip{font-size:12px;color:var(--muted);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ibtns{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.ibtns .x.go{border-color:var(--deploy);color:var(--deploy)}
.iaside{position:sticky;top:12px;display:flex;flex-direction:column;gap:12px}
.dz{border:2px dashed var(--line-strong);border-radius:12px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.dz h3{font-size:13px}.dz p{font-size:12px;color:var(--muted)}
.dragging-issue .dz{border-color:var(--deploy)}
.dz.over{background:var(--deploy-soft);border-style:solid;border-color:var(--deploy)}
.mqlist{gap:0}
.mq{display:flex;gap:8px;align-items:baseline;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--raised);font-size:12px;min-width:0}
.mq .qpos{width:18px;flex:none}.mq .mt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.slot{height:8px;border-radius:4px;flex:none}.slot.on{background:var(--deploy-fill)}
.mqempty{font-size:12px;color:var(--muted);padding:6px 2px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:12px;margin-bottom:22px}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.vcard.lim{border-color:var(--warn-line);background:var(--warn-soft)}
.vtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.vtop h3{font-size:15px;font-weight:700}
.vst{font:600 11px var(--mono);padding:2px 8px;border-radius:999px;background:var(--ok-soft);color:var(--ok)}
.vcard.lim .vst{background:var(--surface);color:var(--warn)}
.vstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0}
.vstats div{display:flex;flex-direction:column;justify-content:flex-end;gap:2px;min-width:0}
.vstats dt{font-size:11px;color:var(--muted)}
.vstats dd{margin:0;font:650 18px var(--mono);font-variant-numeric:tabular-nums}
.vcard .until{font-size:13px;color:var(--warn);font-weight:550}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:22px;display:flex;flex-direction:column;gap:8px}
.panel h3{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;margin:0;font-size:13px}.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
.wl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.wl li{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.wl b{font:600 12px var(--mono)}

/* 11. Modals and toasts */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--shade);overflow:auto}
.mbox{width:min(560px,100%);max-height:100%;overflow:auto;background:var(--surface);border:2px solid var(--tone-fill);border-radius:14px;box-shadow:var(--shadow);padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.mbox h2{font-size:18px}
.mbox form{display:flex;flex-direction:column;gap:12px;margin:0}
.fld{display:flex;flex-direction:column;gap:5px}
.fld input[type=text]{width:100%;height:40px;border:1px solid var(--line-strong);border-radius:9px;padding:0 11px;background:var(--surface)}
.fcount{font:11px var(--mono);color:var(--muted);text-align:right}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.chk input{margin:3px 0 0;width:16px;height:16px;accent-color:var(--accent);flex:none}
.pub{padding:8px 11px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:12px}
.tri{border:1px solid var(--line);background:var(--raised);border-radius:10px;padding:9px 12px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.tri.busy{opacity:.55}.tri b{font-weight:650}.tri small{font:11px var(--mono);color:var(--muted)}
.mact{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}
.toasts{position:fixed;z-index:60;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;width:min(520px,calc(100% - 32px));pointer-events:none}
.toasts.side{left:auto;right:20px;transform:none;width:min(520px,calc(100% - 40px))}
.toast{pointer-events:auto;display:flex;gap:10px;align-items:flex-start;background:var(--surface);color:var(--ink);border:1px solid var(--tone);box-shadow:var(--shadow);border-radius:10px;padding:11px 12px;font-size:14px;animation:rise .24s ease-out both;transition:opacity .2s,transform .2s}
.toast.out{opacity:0;transform:translateY(8px)}
.toast b{color:var(--tone);display:block}.toast b::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--tone-fill);margin-right:7px}
.toast span{overflow-wrap:anywhere}.toast a{color:var(--accent);font-weight:600}
.toast .tx{flex:1;min-width:0}
.toast .tclose{border:0;background:none;color:var(--muted);padding:4px 6px;border-radius:6px;display:inline-flex}
.tiers{margin-top:8px;font-size:12px;color:var(--muted)}
.tiers summary{cursor:pointer;min-height:32px;display:flex;align-items:center}
.tiers ul{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.tiers li{display:flex;gap:8px;align-items:baseline}.tiers li span{overflow-wrap:anywhere}
footer{margin-top:20px;font-size:12px;color:var(--muted)}

/* 12. Responsive: 390 is the owner's phone */
@media (max-width:1100px){.iwrap{grid-template-columns:1fr}.iaside{display:none}.irow{grid-template-columns:1fr}.ibtns{justify-content:flex-start}}
@media (max-width:640px){
  body{font-size:15px}
  .top{padding-block:12px 8px}
  .brand svg{width:32px;height:32px}.brand h1{font-size:18px}
  .brand .repo{max-width:52vw}
  .ibtn.help-btn,.ibtn .lbl-wide{display:none}
  .ibtn{min-height:42px}.ibtn.sq{width:42px}
  .stat-line{font-size:11.5px;padding-bottom:10px}
  .tabs button{padding:12px 6px;flex:1 1 0;min-width:0;gap:5px;font-size:13px}
  .search{max-width:none;flex-basis:100%}
  .search input,.bar select{height:44px;font-size:16px}
  .bar select{flex:1;min-width:0}
  .seg button{min-height:42px}
  .bar .seg.tiersel{flex:1 1 100%}.bar .seg.tiersel button{flex:1}
  .grow{display:none}
  .btn{min-height:44px}.btn.big{min-height:48px}
  .dbox .btns .btn{flex:1 1 140px}
  .deploy .btns,.deploy .btns .btn{width:100%}
  .aibtn{min-height:42px}
  .idchip{min-height:34px;padding:0 12px}.link{min-height:40px;padding:4px 2px}
  .qrow{grid-template-columns:22px minmax(0,1fr)}.qbtns{grid-column:1/-1;justify-content:flex-end}.qbtns .x{width:42px;height:42px}.qbtns .x.rm{width:auto}
  .fadd{width:100%}.fadd input{flex:1;font-size:16px;height:44px}
  .ibtns .x{height:42px}
  .dhead{padding:12px 14px;flex-direction:column-reverse;align-items:stretch;gap:6px}.dtools{justify-content:flex-end}.dbody{padding:14px 14px 28px}
  .stepper{grid-template-columns:repeat(3,1fr);row-gap:10px}
  .timeline li{grid-template-columns:54px 1fr}
  .help{top:auto;bottom:12px}
  .fld input[type=text],textarea{font-size:16px}
  .vstats dd{font-size:16px}
  .toasts.side{right:16px;width:calc(100% - 32px)}
  .drow{grid-template-columns:auto minmax(0,1fr)}.drow .s{grid-column:2}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.flash{border-color:var(--flash)!important}.btn.sending::after{border-right-color:currentColor;opacity:.5}}
</style>
</head>
<body>
<div class="rule" aria-hidden="true"></div>
<div id="page">
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <defs>
        <linearGradient id="forja-steel" x1="5" y1="3" x2="57" y2="64" gradientUnits="userSpaceOnUse">
          <stop stop-color="#292427"/>
          <stop offset="1" stop-color="#131216"/>
        </linearGradient>
        <linearGradient id="forja-ember" x1="18" y1="51" x2="47" y2="13" gradientUnits="userSpaceOnUse">
          <stop stop-color="#FF713E"/>
          <stop offset="1" stop-color="#FFCA76"/>
        </linearGradient>
      </defs>
      <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#forja-steel)"/>
      <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" stroke="#FFFFFF" stroke-opacity=".18"/>
      <path d="M19 43V26a7 7 0 0 1 7-7h10 M19 41l5.5-5.5a7 7 0 0 1 5-2H32"
            stroke="url(#forja-ember)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="19" cy="47" r="4.25" fill="#221B20" stroke="#FF7842" stroke-width="4.5"/>
      <circle cx="36" cy="33.5" r="3.5" fill="#221B20" stroke="#FFAB61" stroke-width="4"/>
      <path d="m47 12.5 6.5 6.5-6.5 6.5-6.5-6.5z" fill="#FFD48B"/>
    </svg>
    <div><h1>Forja</h1><a class="repo" id="repo" target="_blank" rel="noopener"></a></div>
  </div>
  <div class="tools">
    <button class="ibtn go" id="novaBtn" type="button" aria-haspopup="dialog" data-i18n-title="ui.newIssueTip"><span class="ico" data-ico="plus"></span><span data-i18n="ui.newIssue"></span></button>
    <button class="ibtn sq" id="theme" type="button" data-i18n-title="ui.theme.tip"><span class="ico" id="themeIco"></span><span class="sr" id="themeLbl"></span></button>
    <button class="ibtn sq help-btn" id="helpBtn" type="button" aria-haspopup="dialog" aria-controls="help" aria-expanded="false" data-i18n-title="ui.help.tip"><span class="ico" data-ico="help"></span><span class="sr" data-i18n="ui.help.title"></span></button>
  </div>
</header>
<div class="stat-line" id="statLine" role="status"><span class="live" id="live"><span class="dot" aria-hidden="true"></span><span id="liveText"></span></span><span class="runner" id="runner"></span></div>
<div class="help" id="help" role="dialog" data-i18n-aria="ui.help.title" hidden>
  <h2 data-i18n="ui.help.title"></h2>
  <dl>
    <dt><kbd>/</kbd></dt><dd data-i18n="ui.help.search"></dd>
    <dt><kbd>n</kbd></dt><dd data-i18n="ui.help.next"></dd>
    <dt><kbd>j</kbd> <kbd>k</kbd></dt><dd data-i18n="ui.help.move"></dd>
    <dt><kbd>i</kbd></dt><dd data-i18n="ui.help.new"></dd>
    <dt><kbd>g</kbd></dt><dd data-i18n="ui.help.tabs"></dd>
    <dt><kbd>Esc</kbd></dt><dd data-i18n="ui.help.close"></dd>
    <dt><kbd>?</kbd></dt><dd data-i18n="ui.help.toggle"></dd>
  </dl>
</div>
<div class="banner" id="banner" role="status" data-tone="warn" hidden><span class="ico" data-ico="hourglass"></span><p id="bannerText"></p></div>
<nav class="tabs" id="tabs" data-i18n-aria="ui.tabs.label">
  <button id="tabBoard" type="button" aria-pressed="true" aria-controls="vBoard"><span data-i18n="ui.tab.board"></span><span class="count" id="cBoard" hidden></span></button>
  <button id="tabQueue" type="button" aria-pressed="false" aria-controls="vQueue"><span data-i18n="ui.tab.queue"></span><span class="count" id="cQueue" hidden></span></button>
  <button id="tabIssues" type="button" aria-pressed="false" aria-controls="vIssues"><span data-i18n="ui.tab.issues"></span><span class="count" id="cIssues" hidden></span></button>
  <button id="tabCap" type="button" aria-pressed="false" aria-controls="vCap"><span data-i18n="ui.tab.capacity"></span></button>
</nav>

<main>
<section id="vBoard">
  <div class="bar" id="bar" role="search">
    <div class="search"><label class="sr" for="q" data-i18n="ui.filter.searchLabel"></label><input id="q" type="search" data-i18n-ph="ui.filter.searchPh" autocomplete="off"><kbd aria-hidden="true">/</kbd></div>
    <div class="seg tiersel" role="group" data-i18n-aria="ui.filter.tierLabel" id="tierSeg"></div>
    <label class="sr" for="stageSel" data-i18n="ui.filter.stageLabel"></label><select id="stageSel"></select>
    <span class="grow"></span>

function showRunner(r){

/* ---------- 21. Views, shortcuts, theme, boot ---------- */
function setView(v,focus){
  view=v;const map={board:'vBoard',queue:'vQueue',issues:'vIssues',cap:'vCap'};
  for(const [k,id] of Object.entries(map))$(id).hidden=k!==v;
  for(const [k,id] of [['board','tabBoard'],['queue','tabQueue'],['issues','tabIssues'],['cap','tabCap']])$(id).setAttribute('aria-pressed',String(k===v));
  if(v==='queue')loadQueue();
  if(v==='issues'){loadQueue();loadIssues()}
  if(v==='cap')renderCap();
  if(focus){$('sr').textContent=t(VIEW[v]);({queue:'qTitle',issues:'iTitle'}[v]&&$({queue:'qTitle',issues:'iTitle'}[v]).focus())}
}
function setAll(v){showAll=v;$('fActive').setAttribute('aria-pressed',String(!v));$('fAll').setAttribute('aria-pressed',String(v));render()}
function syncTier(){for(const b of $('tierSeg').children)b.setAttribute('aria-pressed',String(b.dataset.tier===tierF))}
function step(dir){
  if(!order.length)return;
  const i=order.indexOf(openId),n=order[(i<0?(dir>0?0:order.length-1):(i+dir+order.length)%order.length)];
  openDrawer(n,false);
  document.querySelector(`[data-key="card:${CSS.escape(n)}"]`)?.scrollIntoView({block:'nearest'});
}
function help(on){const el=$('help');el.hidden=!on;$('helpBtn').setAttribute('aria-expanded',String(on))}
const THEMES=['auto','light','dark'],TICO={auto:'auto',light:'sun',dark:'moon'};
function setTheme(v){
  const r=document.documentElement;if(v==='auto')r.removeAttribute('data-theme');else r.dataset.theme=v;
  $('themeIco').replaceChildren(ico(TICO[v]));$('themeLbl').textContent=t(THEME[v]);$('theme').dataset.v=v;$('theme').setAttribute('aria-label',t('ui.theme.label',{mode:t(THEME[v])}));
  try{localStorage.setItem('forja-theme',v)}catch{}
}
function applyStatic(){
  for(const e of document.querySelectorAll('[data-i18n]'))e.textContent=t(e.dataset.i18n);
  for(const [a,k] of [['data-i18n-title','title'],['data-i18n-aria','aria-label'],['data-i18n-ph','placeholder']])for(const e of document.querySelectorAll(`[${a}]`))e.setAttribute(k,t(e.getAttribute(a)));
  for(const e of document.querySelectorAll('[data-ico]'))e.innerHTML=ICON[e.dataset.ico];
}
function moveFocus(dir){
  const cards=[...document.querySelectorAll('.cbody,.drow')];if(!cards.length)return;
  const i=cards.indexOf(document.activeElement);
  cards[i<0?(dir>0?0:cards.length-1):Math.min(cards.length-1,Math.max(0,i+dir))].focus();
}
function bindUi(){
  $('novaBtn').onclick=novaShow;$('nCancel').onclick=novaHide;$('nForm').onsubmit=novaSend;
  $('nova').addEventListener('mousedown',e=>{if(e.target===$('nova'))novaHide()});
  $('nT').addEventListener('input',e=>{e.target.classList.remove('miss');novaCount();triSoon()});
  $('nB').addEventListener('input',e=>{e.target.classList.remove('miss');novaCount();triSoon()});
  $('nova').addEventListener('keydown',e=>{
    if(e.key!=='Tab')return;
    const f=nIds.map($).filter(x=>!x.disabled&&!x.hidden),first=f[0],last=f.at(-1);
    if(!f.includes(document.activeElement)){e.preventDefault();first.focus()}
    else if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
  });
  $('cNo').onclick=()=>confClose(false);$('cYes').onclick=()=>confClose(true);
  $('qAdd').onsubmit=async e=>{
    e.preventDefault();
    const inp=$('qAddN'),m=inp.value.trim().match(/^#?(\d{1,7})$/);
    inp.classList.toggle('miss',!m);
    if(!m){toast('bad',t('ui.tab.queue'),t('ui.queue.badNumber'),4000);return inp.focus()}
    if(await qAct('add',Number(m[1]))){inp.value='';inp.focus()}
  };
  $('qAddN').addEventListener('input',e=>e.target.classList.remove('miss'));
  $('iQ').oninput=e=>{isQ=e.target.value;isMax=150;renderIssues()};
  $('iRefresh').onclick=()=>loadIssues(true);
  $('tabBoard').onclick=()=>setView('board');$('tabQueue').onclick=()=>setView('queue');$('tabIssues').onclick=()=>setView('issues');$('tabCap').onclick=()=>setView('cap');
  $('dClose').onclick=closeDrawer;$('scrim').onclick=closeDrawer;$('dPrev').onclick=()=>step(-1);$('dNext').onclick=()=>step(1);
  $('fActive').onclick=()=>setAll(false);$('fAll').onclick=()=>setAll(true);
  $('q').oninput=e=>{q=e.target.value;sigBoard='';render()};
  $('stageSel').onchange=e=>{stageF=e.target.value;render()};
  $('helpBtn').onclick=()=>help($('help').hidden);
  $('theme').onclick=()=>setTheme(THEMES[(THEMES.indexOf($('theme').dataset.v||'auto')+1)%3]);
  document.addEventListener('keydown',e=>{
    if(e.ctrlKey||e.metaKey||e.altKey)return;
    if(confOpen){if(e.key==='Escape'){e.preventDefault();confClose(false)}else if(e.key==='Tab'){const f=[$('cNo'),$('cYes')],i=f.indexOf(document.activeElement);e.preventDefault();f[(i+(e.shiftKey?-1:1)+2)%2].focus()}return}
    if(novaOpen){if(e.key==='Escape'){e.preventDefault();novaHide()}return}
    const x=e.target,typing=x.matches?.('input,textarea,select')||x.isContentEditable;
    if(e.key==='Escape'){
      if(!$('help').hidden)help(false);
      else if(openId)closeDrawer();
      else if(x===$('q')){if(q){q='';$('q').value='';sigBoard='';render()}else x.blur()}
      return;
    }
    if(typing)return;
    if(e.key==='/'){e.preventDefault();const s=view==='issues'?$('iQ'):$('q');s.focus();s.select()}
    else if(e.key==='?')help($('help').hidden);
    else if(e.key==='i'){e.preventDefault();novaShow()}
    else if(e.key==='g'){if(!openId){const o=['board','queue','issues','cap'];setView(o[(o.indexOf(view)+1)%4],true)}}
    else if(e.key==='n'){const id=jobs.find(j=>needFor(j)&&!j.paused)?.id;if(id)openDrawer(id,true);else toast('warn',t('ui.sec.needNone'),'',3500)}
    else if(e.key==='j'||e.key==='k'){const d=e.key==='j'?1:-1;if(openId)step(d);else moveFocus(d)}
  });
}
const live=on=>{$('live').classList.toggle('on',on);$('liveText').textContent=on?t('ui.live',{time:new Date().toLocaleTimeString(LOC,{hour:'2-digit',minute:'2-digit'})}):t('ui.offline')};
async function loadJobs(){try{const r=await fetch(api('/api/jobs'));if(!r.ok)throw 0;jobs=(await r.json()).map(withId);watchJobs();watchDeploy();render()}catch{live(false)}}
async function loadCmds(){try{const r=await fetch(api('/api/commands'));if(r.ok){cmds=await r.json();watchCmds();render()}}catch{}}
async function loadDeploy(){try{const r=await fetch(api('/api/deploy'));if(r.ok){dep=await r.json();watchDeploy();render()}}catch{}}
async function loadRunner(){try{showRunner(await (await fetch(api('/api/runner'))).json())}catch{$('runner').textContent=t('ui.runner.unknown')}}
function connect(){
  Promise.all([loadJobs().then(()=>live(true)),loadCmds(),loadDeploy(),loadRunner(),loadQueue()]).then(()=>{booted=true;sigBoard='';render()});
  const es=new EventSource(api('/api/events')),on=fn=>e=>{let d;try{d=JSON.parse(e.data)}catch{return}fn(d)};
  es.onopen=()=>{live(true);loadJobs();loadCmds();loadDeploy();loadRunner();loadQueue()};
  es.addEventListener('queue',()=>loadQueue());
  es.onerror=()=>live(false);
  es.addEventListener('job',on(d0=>{const d=withId(d0);const i=jobs.findIndex(x=>x.id===d.id);if(i<0)jobs.push(d);else jobs[i]=d;watchJobs();watchDeploy();render();live(true)}));
  es.addEventListener('board',()=>loadJobs());
  es.addEventListener('commands',on(d=>{cmds=d;watchCmds();render()}));
  es.addEventListener('deploy',on(d=>{dep=d;watchDeploy();render()}));
  es.addEventListener('runner',on(showRunner));
  setInterval(()=>{loadRunner();loadDeploy()},30000);
  setInterval(render,20000);
  setInterval(()=>{if(view==='queue')loadQueue();if(view==='issues')loadIssues()},30000);
  setInterval(paintAll,1000);
}
async function boot(){
  try{const r=await fetch(api('/api/config'));if(!r.ok)throw 0;CFG=await r.json()}catch{$('boardBody').replaceChildren(h('div',{class:'empty'},document.querySelector('meta[name="forja-boot-failed"]')?.content||'Forja'));return}
  STR=CFG.strings||{};LOC=CFG.language||'en';REPO='https://github.com/'+CFG.repo;
  RANK=Object.fromEntries(CFG.tiers.map((x,i)=>[x.id,i]));
  document.documentElement.lang=LOC;
  applyStatic();bindUi();
  $('repo').textContent=CFG.repo;$('repo').href=REPO;
  $('tierSeg').replaceChildren(h('button',{type:'button','data-tier':'','aria-pressed':'true',onclick:()=>{tierF='';syncTier();render()}},t('ui.filter.allTiers')),...CFG.tiers.map(x=>h('button',{type:'button','data-tier':x.id,'aria-pressed':'false',title:x.describe,onclick:()=>{tierF=x.id;syncTier();render()}},x.id)));
  $('stageSel').replaceChildren(h('option',{value:''},t('ui.filter.allStages')),...STAGES.slice(0,5).map(k=>h('option',{value:k},t(STEP[k]))),h('option',{value:'done'},t('ui.sec.done')));
  $('tiersList').replaceChildren(...CFG.tiers.map(x=>h('li',null,h('span',{class:'tier','data-r':RANK[x.id]===0?'low':RANK[x.id]===CFG.tiers.length-1?'high':'mid'},x.id),h('span',null,x.describe+' · '+t(x.approval==='auto'?'ui.approval.auto':'ui.approval.owner')))));
  let th='auto';try{const s=localStorage.getItem('forja-theme');if(THEMES.includes(s))th=s}catch{}
  setTheme(th);setView('board');live(false);$('runner').textContent=t('ui.runner.unknown');
  render();connect();
}
boot();
