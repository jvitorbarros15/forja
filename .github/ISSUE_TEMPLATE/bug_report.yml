name: Bug report
description: Report a problem with Forja
body:
  - type: input
    id: forja-version
    attributes:
      label: Forja version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: Include the OS version.
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
    validations:
      required: true
  - type: input
    id: vendors
    attributes:
      label: Enabled vendors
      description: List enabled optional vendors, or say Claude only.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Include the steps to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Relevant doctor output
      description: Paste relevant output from `/forja:doctor` and redact secrets.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste relevant lines from `.forja/state/logs` and redact secrets.
      render: text
