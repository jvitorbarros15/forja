name: Feature request
description: Suggest a change to Forja
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe your workflow and where you get stuck.
    validations:
      required: true
  - type: textarea
    id: proposed-change
    attributes:
      label: What change would help?
      description: Describe how you would expect it to work.
    validations:
      required: true
