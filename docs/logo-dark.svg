      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="48%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="forge-bar-dark" x1="13" y1="26" x2="37" y2="26" gradientUnits="userSpaceOnUse">
